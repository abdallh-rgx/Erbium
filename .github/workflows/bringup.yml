name: android-bringup

# Full emulator bring-up pipeline (ARM64 host runner).
#
# Phase flags let us iterate: each phase is independently skippable so a red
# step never blocks validating the steps before it.
#
#   phase_apk:     download APK + analyze libUnreal.so (bake offsets) +
#                  build liberbium.so (NDK) + patch + sign
#   phase_install: boot emulator, install APK, launch, watch logcat
#   phase_backend: run Voltronite + Owen.c redirect (later phases)
#
# Inputs:
#   apk_url     — direct HTTP(S) URL to the Fortnite APK (XAPK also accepted).
#                 Empty = use the repo's release asset (see get_apk step).
#   version     — human label, e.g. 21.30.0-21088273
#   keep_alive  — minutes to keep the runner alive after the test (for live
#                 inspection over Tailscale)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK/XAPK URL (leave empty to use release asset)'
        required: false
        default: ''
      version:
        description: 'Version label (e.g. 21.30.0-21088273)'
        required: false
        default: '21.30.0-21088273'
      image_flavor:
        description: 'System image flavor: google_apis (adb root + ndk_translation) or default (deprecated playstore image was removed from the SDK repo)'
        required: false
        default: 'google_apis'
      keep_alive:
        description: 'Minutes to keep runner alive after test (0 = off)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  emulator:
    # x86_64 host + API-30 google_apis x86_64 image (r16+): ships ndk_translation
    # (abilist includes arm64-v8a, fingerprint generic_x86_64_arm64), so arm64-v8a
    # apps (Fortnite + liberbium) run translated. The playstore image was removed
    # from the SDK repository (2026); google_apis r16 replaced it AND allows
    # `adb root` → real sendevent 4-finger console automation.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      API_LEVEL: '30' # Android 11 — x86_64 image w/ ndk_translation (runs arm64 apps)
      IMAGE_FLAVOR: google_apis
      ABI: arm64-v8a
      NDK_VER: '27.2.12479018'
      # pin the AVD home for BOTH avdmanager and emulator — newer cmdline-tools
      # put AVDs under XDG (~/.config/.android/avd) while the emulator only
      # searches $ANDROID_AVD_HOME / $ANDROID_SDK_HOME/avd / ~/.android/avd
      ANDROID_AVD_HOME: /home/runner/.android/avd
      # ONE adb to rule them all: the apt-installed /usr/bin/adb spawns a
      # second server with different keys → "device unauthorized" flapping
      PATH: /home/runner/android-sdk/platform-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4

      # ── Tailscale (lets you SSH into this runner while it lives) ──────────
      - name: Setup Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh || true
          sudo tailscaled --state=/tmp/tailscaled.state --socket=/tmp/tailscaled.sock &
          sleep 2
          if [ -n "$TS_AUTHKEY" ]; then
            sudo tailscale --socket=/tmp/tailscaled.sock up \
              --authkey="$TS_AUTHKEY" \
              --hostname="erbium-ci-${{ github.run_id }}" \
              --accept-routes || echo "tailscale up failed (non-fatal)"
            IP=$(sudo tailscale --socket=/tmp/tailscaled.sock ip -4 || echo '')
            echo "RUNNER_TAILSCALE_IP=$IP" | tee -a "$GITHUB_ENV"
          else
            echo "no tailscale authkey — skipping"
          fi

      - name: Install base tooling
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless unzip wget curl python3-pip adb udev python3-pil

      # ── Android SDK + emulator (ARM64 system image, no KVM → QEMU TCG) ───
      - name: Install Android SDK + emulator + NDK + system image
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          FLAVOR="${{ github.event.inputs.image_flavor }}"
          # google_apis (non-playstore) allows `adb root` → sendevent-based
          # 4-finger console automation. (playstore flavor no longer exists in
          # the SDK repo — kept only as an override for pinned local images;
          # without root the gameflow test falls back to emulator-console
          # touch injection.)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "ndk;${NDK_VER}" \
            "system-images;android-30;${FLAVOR};x86_64" > /dev/null
          echo "IMAGE_FLAVOR=$FLAVOR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Create AVD
        run: |
          set -e
          # avdmanager on this runner misbehaves (creates avd.name=<build> in
          # XDG paths the emulator never searches). Create the AVD by hand —
          # an AVD is just a config.ini + a pointer .ini next to it.
          AVD_DIR="$ANDROID_AVD_HOME/erbium.avd"
          mkdir -p "$AVD_DIR" "$ANDROID_AVD_HOME"
          cat > "$AVD_DIR/config.ini" <<EOF
          avd.id=erbium
          avd.name=erbium
          avd.ini.encoding=UTF-8
          Abi.type=x86_64
          AvdId=erbium
          Tag=${IMAGE_FLAVOR}
          Tag.display=${IMAGE_FLAVOR}
          image.sysdir.1=system-images/android-30/${IMAGE_FLAVOR}/x86_64/
          hw.device.name=pixel_4
          hw.device.manufacturer=Google
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.ramSize=2048
          vm.heapSize=256
          disk.dataPartition.size=6G
          hw.lcd.density=440
          hw.lcd.width=1080
          hw.lcd.height=2280
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          fastboot.forceColdBoot=yes
          EOF
          cat > "$ANDROID_AVD_HOME/erbium.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/erbium.avd
          EOF
          ls -la "$ANDROID_AVD_HOME"
          cat "$ANDROID_AVD_HOME/erbium.ini"
          # the emulator must see it now
          "$ANDROID_HOME/emulator/emulator" -list-avds

      - name: Boot emulator (QEMU, SwiftShader)
        run: |
          set -e
          # KVM is available on ubuntu-latest runners but the runner user lacks
          # group perms — open the device (standard CI workaround)
          ls -la /dev/kvm || true
          sudo chmod 666 /dev/kvm || true
          # Start the (single, SDK) adb server BEFORE the emulator so the
          # host keypair exists when the guest boots — kills the
          # "device unauthorized" race on playstore images.
          adb start-server 2>/dev/null || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd erbium \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 8192 -cores 4 \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          # bounded wait for adb (never trust `adb wait-for-device` alone —
          # it hangs forever if the emulator process died)
          echo "Waiting for adb device (up to 5 min)..."
          ADB_UP=0
          for i in $(seq 1 60); do
            if ! kill -0 $EMU_PID 2>/dev/null; then
              echo "EMULATOR PROCESS DIED — log tail:"
              tail -50 /tmp/emulator.log
              exit 1
            fi
            if adb devices 2>/dev/null | grep -qE "emulator-[0-9]+[[:space:]]+device"; then
              ADB_UP=1; break
            fi
            sleep 5
          done
          if [ "$ADB_UP" != "1" ]; then
            echo "ADB never came up — emulator log tail:"
            tail -50 /tmp/emulator.log
            exit 1
          fi
          echo "Waiting for boot (KVM-accelerated)..."
          # adb shell blocks through the unauthorized/offline phases; the outer
          # timeout bounds the whole wait. One reconnect retry on timeout.
          timeout 900 adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 5; done' \
            || { adb reconnect offline || true; sleep 5; \
                 timeout 300 adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 5; done'; } \
            || { echo "BOOT TIMED OUT — emulator log tail:"; tail -80 /tmp/emulator.log; exit 1; }
          adb shell getprop ro.build.version.release
          echo "Emulator booted."

      # ── APK: fetch, analyze, build, patch, sign ───────────────────────────
      - name: Download APK
        run: |
          set -e
          mkdir -p artifacts
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            curl -fsSL --retry 3 -o artifacts/fortnite.apk "${{ github.event.inputs.apk_url }}"
          else
            # encrypted release asset on this fork — decrypted with repo secret
            VER="${{ github.event.inputs.version }}"
            TAG="apk-${VER}"
            gh release download "$TAG" --pattern "fortnite-*.apk.enc" --output artifacts/fortnite.apk.enc --repo "$GITHUB_REPOSITORY"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:APK_CRYPT_KEY -in artifacts/fortnite.apk.enc -out artifacts/fortnite.apk
            rm artifacts/fortnite.apk.enc
          fi
          ls -la artifacts/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_CRYPT_KEY: ${{ secrets.APK_CRYPT_KEY }}

      - name: Analyze libUnreal.so (bake per-version offsets)
        run: |
          set -e
          # version label "21.30.0-21088273" → bake id "21.30"
          BAKE_ID=$(python3 - <<'PY'
          import re,sys
          v = "${{ github.event.inputs.version }}"
          m = re.match(r"(\d+\.\d+)", v)
          print(m.group(1) if m else "unknown")
          PY
          )
          echo "BAKE_ID=$BAKE_ID" >> "$GITHUB_ENV"
          python3 scripts/analyze_libue4.py \
            --apk artifacts/fortnite.apk \
            --version "${{ github.event.inputs.version }}" \
            --out "android/Generated/offsets-${BAKE_ID}.h"
          grep -E "kGIsClient|kGIsServer|kGEngine|kNativeConsoleCommand" "android/Generated/offsets-${BAKE_ID}.h"

      - name: Build liberbium.so (NDK, arm64-v8a)
        run: |
          set -e
          cd android
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VER}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DERBIUM_TARGET_VERSION="$BAKE_ID"
          cmake --build build --verbose
          ls -la build/liberbium.so
          mkdir -p ../artifacts/native && cp build/liberbium.so ../artifacts/native/

      - name: Patch APK (onCreate → loadLibrary)
        run: |
          set -e
          df -h / /home || true
          # reclaim disk: apt caches, sdk zips, emulator download leftovers
          sudo apt-get clean || true
          rm -rf "$HOME/android-sdk/.temp" "$HOME/android-sdk/*.zip" /tmp/clt.zip 2>/dev/null || true
          df -h /
          bash scripts/patch_apk.sh artifacts/fortnite.apk artifacts/fortnite-patched.apk artifacts/analysis android/build/liberbium.so

      - name: Start Voltronite backend (:3551)
        run: |
          set -e
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          git clone --depth 1 https://github.com/abdallh-rgx/Voltronite.git /tmp/voltronite
          cd /tmp/voltronite
          # emulator reaches the host loopback via 10.0.2.2; matchmaker ws too
          cat > .env <<'ENV'
          PORT=3551
          MATCHMAKER_PORT=8080
          GAMESERVER_IP=127.0.0.1:7777
          MATCHMAKER_IP=ws://10.0.2.2:8080
          ENV
          bun install
          nohup bun src/app.ts > /tmp/voltronite.log 2>&1 &
          sleep 5
          curl -s http://127.0.0.1:3551/ | head -1
          echo "backend up"

      - name: Install APK
        run: |
          set -e
          adb install -r -t artifacts/fortnite-patched.apk

      # ── FULL GAME FLOW: launch → internal update → Voltronite login →
      #    GO → map load → in-match screenshot + player verification ─────
      - name: Game-flow test (update → login → match → verify)
        env:
          VOLTRONITE_LOG: /tmp/voltronite.log
        run: |
          bash scripts/android/gameflow_test.sh \
            --skip-install \
            --backend http://10.0.2.2:3551 \
            --user ErbiumCI || TEST_RC=$?
          # the driver never exits non-zero on its own — but guard anyway
          echo "gameflow exit: ${TEST_RC:-0}"
          cat artifacts/VERDICT.txt 2>/dev/null || true
          # surface the verdict in the job log + fail the step on FAIL
          if [ -f artifacts/VERDICT.txt ] && grep -q "OVERALL: PASS" artifacts/VERDICT.txt; then
            echo ">>> GAME FLOW: PASS <<<"
          else
            echo ">>> GAME FLOW: FAIL — inspect artifacts <<<"
            exit 1
          fi

      - name: Keep-alive (optional, for live SSH debugging)
        if: ${{ github.event.inputs.keep_alive != '0' }}
        run: |
          echo "Runner stays alive ${{ github.event.inputs.keep_alive }} minutes."
          echo "Tailscale IP: ${RUNNER_TAILSCALE_IP:-unknown} — ssh into it while it lasts."
          sleep $(( ${{ github.event.inputs.keep_alive }} * 60 ))

      - name: Always upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bringup-${{ github.event.inputs.version }}-${{ github.run_id }}
          path: |
            artifacts/
            /tmp/emulator.log
            /tmp/voltronite.log
          if-no-files-found: warn
