name: android-bringup

# Full emulator bring-up pipeline (ARM64 host runner).
#
# Phase flags let us iterate: each phase is independently skippable so a red
# step never blocks validating the steps before it.
#
#   phase_apk:     download APK + analyze libUnreal.so (bake offsets) +
#                  build liberbium.so (NDK) + patch + sign
#   phase_install: boot emulator, install APK, launch, watch logcat
#   phase_backend: run Voltronite + Owen.c redirect (later phases)
#
# Inputs:
#   apk_url     — direct HTTP(S) URL to the Fortnite APK (XAPK also accepted).
#                 Empty = use the repo's release asset (see get_apk step).
#   version     — human label, e.g. 21.30.0-21088273
#   keep_alive  — minutes to keep the runner alive after the test (for live
#                 inspection over Tailscale)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK/XAPK URL (leave empty to use release asset)'
        required: false
        default: ''
      version:
        description: 'Version label (e.g. 21.30.0-21088273)'
        required: false
        default: '21.30.0-21088273'
      keep_alive:
        description: 'Minutes to keep runner alive after test (0 = off)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  emulator:
    # x86_64 host: the Android emulator package only ships for linux-x86_64.
    # The GUEST is still arm64-v8a (system-images;android-29;google_apis;arm64-v8a)
    # — QEMU TCG translates the ARM64 game code on the x86_64 host.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_LEVEL: '29' # Android 10
      ABI: arm64-v8a
      NDK_VER: '27.2.12479018'
    steps:
      - uses: actions/checkout@v4

      # ── Tailscale (lets you SSH into this runner while it lives) ──────────
      - name: Setup Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh || true
          sudo tailscaled --state=/tmp/tailscaled.state --socket=/tmp/tailscaled.sock &
          sleep 2
          if [ -n "$TS_AUTHKEY" ]; then
            sudo tailscale --socket=/tmp/tailscaled.sock up \
              --authkey="$TS_AUTHKEY" \
              --hostname="erbium-ci-${{ github.run_id }}" \
              --accept-routes || echo "tailscale up failed (non-fatal)"
            IP=$(sudo tailscale --socket=/tmp/tailscaled.sock ip -4 || echo '')
            echo "RUNNER_TAILSCALE_IP=$IP" | tee -a "$GITHUB_ENV"
          else
            echo "no tailscale authkey — skipping"
          fi

      - name: Install base tooling
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless unzip wget curl python3-pip adb udev

      # ── Android SDK + emulator (ARM64 system image, no KVM → QEMU TCG) ───
      - name: Install Android SDK + emulator + NDK + system image
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "ndk;${NDK_VER}" \
            "system-images;android-29;google_apis;arm64-v8a" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Create AVD
        run: |
          set -e
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n erbium -k "system-images;android-29;google_apis;arm64-v8a" -d pixel_4

      - name: Boot emulator (QEMU, SwiftShader)
        run: |
          set -e
          nohup "$ANDROID_HOME/emulator/emulator" -avd erbium \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel off -memory 8192 -cores 4 \
            > /tmp/emulator.log 2>&1 &
          echo "Waiting for boot (QEMU TCG is slow — up to 30 min)..."
          adb wait-for-device
          timeout 1800 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 10; done'
          adb shell getprop ro.build.version.release
          echo "Emulator booted."

      # ── APK: fetch, analyze, build, patch, sign ───────────────────────────
      - name: Download APK
        run: |
          set -e
          mkdir -p artifacts
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            curl -fsSL --retry 3 -o artifacts/fortnite.apk "${{ github.event.inputs.apk_url }}"
          else
            # encrypted release asset on this fork — decrypted with repo secret
            VER="${{ github.event.inputs.version }}"
            TAG="apk-${VER}"
            gh release download "$TAG" --pattern "fortnite-*.apk.enc" --output artifacts/fortnite.apk.enc --repo "$GITHUB_REPOSITORY"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:APK_CRYPT_KEY -in artifacts/fortnite.apk.enc -out artifacts/fortnite.apk
            rm artifacts/fortnite.apk.enc
          fi
          ls -la artifacts/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_CRYPT_KEY: ${{ secrets.APK_CRYPT_KEY }}

      - name: Analyze libUnreal.so (bake per-version offsets)
        run: |
          set -e
          # version label "21.30.0-21088273" → bake id "21.30"
          BAKE_ID=$(python3 - <<'PY'
          import re,sys
          v = "${{ github.event.inputs.version }}"
          m = re.match(r"(\d+\.\d+)", v)
          print(m.group(1) if m else "unknown")
          PY
          )
          echo "BAKE_ID=$BAKE_ID" >> "$GITHUB_ENV"
          python3 scripts/analyze_libue4.py \
            --apk artifacts/fortnite.apk \
            --version "${{ github.event.inputs.version }}" \
            --out "android/Generated/offsets-${BAKE_ID}.h"
          grep -E "kGIsClient|kGIsServer|kGEngine|kNativeConsoleCommand" "android/Generated/offsets-${BAKE_ID}.h"

      - name: Build liberbium.so (NDK, arm64-v8a)
        run: |
          set -e
          cd android
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VER}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DERBIUM_TARGET_VERSION="$BAKE_ID"
          cmake --build build --verbose
          ls -la build/liberbium.so
          mkdir -p ../artifacts/native && cp build/liberbium.so ../artifacts/native/

      - name: Patch APK (onCreate → loadLibrary)
        run: |
          set -e
          bash scripts/patch_apk.sh artifacts/fortnite.apk artifacts/fortnite-patched.apk artifacts/analysis android/build/liberbium.so

      - name: Install & launch
        run: |
          set -e
          adb install -r artifacts/fortnite-patched.apk
          # Clear old logcat, then launch and stream
          adb logcat -c
          adb shell monkey -p com.epicgames.fortnite -c android.intent.category.LAUNCHER 1 || true

      - name: Watch logcat for Erbium + crashes (15 min)
        run: |
          set -e
          adb logcat -d > artifacts/logcat-full.txt || true
          # Stream for up to 15 minutes, stopping early on native crash
          END=$((SECONDS+900))
          while [ $SECONDS -lt $END ]; do
            adb logcat -d >> artifacts/logcat-full.txt || true
            if adb shell ls /data/tombstones 2>/dev/null | grep -q tombstone; then
              echo "TOMBSTONE DETECTED"
              adb shell su 0 ls /data/tombstones 2>/dev/null || true
              break
            fi
            if grep -q "FATAL EXCEPTION\|SIGSEGV\|liberbium.*crash" artifacts/logcat-full.txt; then
              echo "CRASH DETECTED — see artifacts"
              break
            fi
            if grep -q "POST-FLIP" artifacts/logcat-full.txt; then
              echo ">>> ERBIUM FLAG FLIP HAPPENED <<<"
            fi
            if grep -q "dispatching console command" artifacts/logcat-full.txt; then
              echo ">>> ERBIUM OPEN COMMAND DISPATCHED <<<"
            fi
            sleep 15
          done
          grep -E "Erbium|SIGSEGV|FATAL|tombstone|DEBUG|LogNet|LogWorld" artifacts/logcat-full.txt | tail -200 > artifacts/logcat-erbium.txt || true
          # key milestone lines for the job summary
          {
            echo "## Erbium bring-up log digest"
            echo '```'
            grep -E "Erbium|POST-FLIP|dispatching|LogNet.*Listen|LogWorld.*Artemis" artifacts/logcat-full.txt | tail -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep-alive (optional, for live SSH debugging)
        if: ${{ github.event.inputs.keep_alive != '0' }}
        run: |
          echo "Runner stays alive ${{ github.event.inputs.keep_alive }} minutes."
          echo "Tailscale IP: ${RUNNER_TAILSCALE_IP:-unknown} — ssh into it while it lasts."
          sleep $(( ${{ github.event.inputs.keep_alive }} * 60 ))

      - name: Always upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bringup-${{ github.event.inputs.version }}-${{ github.run_id }}
          path: |
            artifacts/
            /tmp/emulator.log
          if-no-files-found: warn
